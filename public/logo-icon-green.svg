<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="eagleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ECC71"/>
      <stop offset="100%" style="stop-color:#1ABC9C"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Eagle/Phoenix wing forming a "D" shape -->
  <g filter="url(#glow)">
    <!-- Main wing body -->
    <path d="M60 40 C60 40, 140 30, 150 80 C155 100, 150 130, 120 155 C100 170, 70 170, 55 160 L55 60 C55 48, 58 42, 60 40Z" fill="url(#eagleGrad)" opacity="0.95"/>
    <!-- Wing feather details -->
    <path d="M65 50 C80 45, 130 40, 145 75 C150 88, 148 105, 140 120" stroke="#C4E538" stroke-width="2" fill="none" opacity="0.7"/>
    <path d="M65 65 C80 58, 120 55, 138 80 C145 92, 142 110, 130 130" stroke="#00FF88" stroke-width="1.5" fill="none" opacity="0.5"/>
    <!-- Inner D cutout -->
    <path d="M75 70 C75 70, 115 65, 125 90 C130 105, 125 125, 105 140 C95 147, 80 148, 75 145Z" fill="#0A1628"/>
    <!-- Eye/spark -->
    <circle cx="100" cy="72" r="4" fill="#C4E538"/>
    <circle cx="100" cy="72" r="2" fill="#FFFFFF"/>
    <!-- Eagle beak accent -->
    <path d="M145 78 L160 85 L148 90" fill="#C4E538" opacity="0.9"/>
  </g>
</svg>
